<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="100%">
  <defs>
    <!-- Top Arc Path for Text -->
    <path id="topCurve" d="M 38 135 A 122 105 0 0 1 282 135" fill="none" />
    <!-- Bottom Arc Path for Text -->
    <path id="bottomCurve" d="M 284 130 A 122 105 0 0 1 36 130" fill="none" />
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e4f4d"/>
      <stop offset="50%" stop-color="#0a4140"/>
      <stop offset="100%" stop-color="#062e2e"/>
    </linearGradient>
  </defs>

  <!-- Oval Badge -->
  <ellipse cx="160" cy="130" rx="146" ry="118" fill="url(#badgeGrad)" stroke="#176361" stroke-width="2.5" />

  <!-- Top Text: Béton Ciré - Moquette de pierre -->
  <text fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1.2">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">
      Béton Ciré • Moquette de pierre
    </textPath>
  </text>

  <!-- Central AS Monogram (Italic Bold Geometric) -->
  <g transform="translate(160, 132) skewX(-16)">
    <!-- Letter A -->
    <path d="M -68, 22 L -34, -42 L -6, -42 L 28, 22 L 6, 22 L -2, 4 L -40, 4 L -48, 22 Z M -33, -12 L -9, -12 L -21, -31 Z" fill="#FFFFFF" />
    <!-- Letter S overlapping / interlocking -->
    <path d="M 2, -18 C 12, -42 58, -46 68, -24 C 73, -13 69, 1 54, 9 L 26, 20 C 14, 25 18, 32 30, 32 C 45, 32 62, 22 66, 12 L 84, 16 C 76, 36 48, 46 26, 46 C 4, 46 -2, 33 0, 19 C 2, 7 12, 1 28, -5 L 52, -14 C 62, -18 58, -26 44, -26 C 30, -26 18, -18 14, -8 Z" fill="#FFFFFF" />
  </g>

  <!-- Bottom Text: Résine décorative Epoxy -->
  <text fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1.2">
    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">
      Résine décorative Epoxy
    </textPath>
  </text>
</svg>
